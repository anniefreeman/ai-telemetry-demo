[project]
name = "sustainable-fashion-advisor"
version = "0.1.0"
description = "CLI demo for sustainable fashion scoring with OpenAI and Coralogix tracing."
requires-python = ">=3.9"
dependencies = [
    "openai",
    "llm-tracekit",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "typer>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sustainable-fashion-advisor = "sustainable_fashion_advisor.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"sustainable_fashion_advisor.data" = ["*.json", "fixtures/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
